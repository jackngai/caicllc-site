<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coreg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243d"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
  </defs>

  <!-- connectors (hub to modules) -->
  <g stroke="#b6cde6" stroke-width="2.5" stroke-linecap="round">
    <line x1="600" y1="600" x2="392" y2="430"/>
    <line x1="600" y1="600" x2="812" y2="408"/>
    <line x1="600" y1="600" x2="836" y2="772"/>
    <line x1="600" y1="600" x2="404" y2="792"/>
    <line x1="392" y1="430" x2="404" y2="792" stroke="#d3e1f0" stroke-dasharray="3 12"/>
    <line x1="812" y1="408" x2="836" y2="772" stroke="#d3e1f0" stroke-dasharray="3 12"/>
  </g>
  <!-- flow dots along the live connectors -->
  <g fill="#0077cc">
    <circle cx="496" cy="515" r="6"/>
    <circle cx="706" cy="504" r="6"/>
    <circle cx="718" cy="686" r="6"/>
    <circle cx="502" cy="696" r="6"/>
  </g>

  <!-- module: top-left (light) -->
  <g>
    <rect x="328" y="366" width="128" height="128" rx="22" fill="#ffffff" stroke="#d4e1f0" stroke-width="2"/>
    <rect x="354" y="402" width="46" height="9" rx="4.5" fill="#c5d6ea"/>
    <rect x="354" y="424" width="76" height="9" rx="4.5" fill="#dde7f3"/>
    <circle cx="362" cy="462" r="9" fill="#9cc1e6"/>
  </g>

  <!-- module: top-right (accent) -->
  <g>
    <rect x="754" y="350" width="116" height="116" rx="20" fill="#0077cc"/>
    <rect x="778" y="384" width="42" height="8" rx="4" fill="#bfe0ff"/>
    <rect x="778" y="404" width="68" height="8" rx="4" fill="#7fc0f4"/>
    <circle cx="786" cy="438" r="8" fill="#ffffff"/>
  </g>

  <!-- module: bottom-right (light) -->
  <g>
    <rect x="766" y="702" width="140" height="140" rx="24" fill="#ffffff" stroke="#d4e1f0" stroke-width="2"/>
    <rect x="794" y="742" width="52" height="9" rx="4.5" fill="#c5d6ea"/>
    <rect x="794" y="766" width="84" height="9" rx="4.5" fill="#dde7f3"/>
    <circle cx="803" cy="806" r="10" fill="#9cc1e6"/>
  </g>

  <!-- module: bottom-left (tint) -->
  <g>
    <rect x="344" y="732" width="120" height="120" rx="22" fill="#e9f3fc" stroke="#cfe0f1" stroke-width="2"/>
    <rect x="370" y="768" width="44" height="8" rx="4" fill="#a9ccec"/>
    <rect x="370" y="788" width="70" height="8" rx="4" fill="#c8ddf1"/>
    <circle cx="378" cy="822" r="8" fill="#88b6e2"/>
  </g>

  <!-- core (hub) -->
  <rect x="516" y="516" width="168" height="168" rx="30" fill="url(#coreg)"/>
  <g>
    <circle cx="600" cy="588" r="20" fill="#2aa0f0"/>
    <rect x="556" y="628" width="88" height="10" rx="5" fill="#33425e"/>
    <rect x="556" y="650" width="56" height="10" rx="5" fill="#2a394f"/>
  </g>
</svg>
